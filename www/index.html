<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manuscript</title>
<style>
:root{--ln:#a2a9b1;--lk:#0645ad;--bg2:#f8f9fa;--wd:#2b579a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:16px/1.65 -apple-system,Roboto,"Segoe UI",sans-serif;color:#202122;background:#fff}
button{font:inherit;cursor:pointer;color:inherit}
.hide{display:none!important}
/* header halaman baca */
#hd{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;border-bottom:1px solid var(--ln);background:var(--bg2);position:sticky;top:0;z-index:5}
#hd button{width:40px;height:40px;border:0;background:none;font-size:22px;border-radius:50%}
.logo{font:22px Georgia,"Linux Libertine",serif}
main.read{max-width:820px;margin:auto;padding:4px 16px 80px}
main.edit{padding:0}
/* konten gaya Wikipedia (dipakai di mode baca dan kertas editor) */
.content h1,.content h2,.content h3,.content h4,h1{font-family:Georgia,"Linux Libertine",serif;line-height:1.3}
h1{font-size:1.8em;font-weight:400;margin:.4em 0;border-bottom:1px solid var(--ln)}
.content h2{font-size:1.5em;font-weight:400;margin:1em 0 .5em;border-bottom:1px solid var(--ln)}
.content h3{font-size:1.2em;margin:1em 0 .3em}.content h4{font-size:1.05em;margin:1em 0 .3em}
.content p{margin:.6em 0}
.content a{color:var(--lk);text-decoration:none}.content a.new{color:#ba0000}
.content .wikitable{border-collapse:collapse;background:var(--bg2);border:1px solid var(--ln);margin:1em 0;max-width:100%}
.content .wikitable th,.content .wikitable td{border:1px solid var(--ln);padding:.3em .6em;min-width:3em}
.content .wikitable th{background:#eaecf0}
.content figure.thumb{max-width:420px;margin:12px auto;border:1px solid #c8ccd1;background:var(--bg2);padding:4px;font-size:.88em}
.content figure.thumb img{width:100%;display:block}
.content figure.thumb figcaption{padding:4px 2px}
.content img{max-width:100%}
.titlebar{display:flex;align-items:flex-end;gap:8px}.titlebar h1{flex:1}
.pen{width:42px;height:42px;margin-bottom:6px;border:1px solid var(--ln);border-radius:50%;background:var(--bg2);font-size:20px;color:#36c}
.muted{color:#72777d}
/* beranda ala halaman awal browser */
.hm{max-width:520px;margin:auto;padding:calc(8vh + env(safe-area-inset-top)) 16px 40px;text-align:center}
.wm{font:34px Georgia,"Linux Libertine",serif;margin:6px 0 26px}
.pill{width:100%;padding:14px 20px;border:0;border-radius:28px;background:#eef0f3;font:inherit;outline:none}
.pill:focus{box-shadow:0 0 0 2px #8ab4f8}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px;margin-top:30px}
.tile{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ci{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
.ci.plus{background:#f1f3f4;color:#5f6368;font-size:30px}
.lb{font-size:13px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* editor ala Word */
.wd{height:100dvh;display:flex;flex-direction:column;background:#e1e1e1}
.wbar{display:flex;align-items:center;gap:6px;background:var(--wd);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}
.wbar button{border:0;background:none;color:#fff;font-size:22px;width:40px;height:40px;border-radius:4px}
.wbar #sv{width:auto;padding:0 14px;font-size:15px;background:#fff;color:var(--wd);height:36px}
.wbar input,.wbar .wt{flex:1;min-width:0;background:rgba(255,255,255,.15);border:0;border-radius:4px;padding:8px 10px;color:#fff;font:16px sans-serif;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar input::placeholder{color:#cdd9ee}
.tabs{display:flex;background:#f3f3f3;border-bottom:1px solid #d4d4d4}
.tabs button{border:0;background:none;padding:8px 16px;font-size:14px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--wd);border-color:var(--wd);font-weight:600}
.rib{display:flex;align-items:center;gap:2px;padding:4px 6px;background:#f3f3f3;border-bottom:1px solid #d4d4d4;overflow-x:auto;white-space:nowrap}
.rib button{flex:none;min-width:38px;height:38px;padding:0 8px;border:0;border-radius:4px;background:none;font-size:16px;display:flex;align-items:center;justify-content:center;gap:4px}
.rib button.on{background:#c7d7f0}
.rib button.txt{font-size:14px}
.rib select{flex:none;height:36px;border:1px solid #c8c8c8;border-radius:4px;background:#fff;font:14px sans-serif;margin:0 4px}
.rib i.sp{flex:none;width:1px;height:24px;background:#d0d0d0;margin:0 4px}
.canvas{flex:1;overflow:auto;padding:0 8px;-webkit-overflow-scrolling:touch}
.paper{background:#fff;max-width:794px;min-height:calc(100% - 24px);margin:12px auto;padding:22px 18px 60px;box-shadow:0 1px 4px rgba(0,0,0,.3);outline:none;font-family:Calibri,Carlito,Roboto,sans-serif;overflow-wrap:anywhere}
.paper:empty:before{content:attr(data-ph);color:#9a9a9a}
.sbar{display:flex;align-items:center;justify-content:space-between;background:var(--wd);color:#fff;font-size:13px;padding:4px 12px calc(4px + env(safe-area-inset-bottom))}
.sbar button{border:0;background:none;color:#ffd0d0;font-size:13px;padding:6px 8px}
</style>
</head>
<body>
<header id="hd" class="hide"><button id="bk" aria-label="Kembali">←</button><div class="logo">Manuscript</div></header>
<main id="app"></main>
<input type="file" id="fi" accept="image/*" class="hide">
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- Penyimpanan (IndexedDB) ---------- */
const db=new Promise((ok,no)=>{const r=indexedDB.open('manuscript',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('notes',{keyPath:'id'});
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('notes',m),o=f(t.objectStore('notes'));t.oncomplete=()=>ok(o&&o.result);t.onerror=()=>no(t.error)})};
const put=v=>tx('readwrite',o=>o.put(v)),del=k=>tx('readwrite',o=>o.delete(k));
let notes=[],cur={v:'home'},leaving=null,syncRib=null;
const load=async()=>{notes=await tx('readonly',o=>o.getAll())};
const has=t=>notes.some(n=>n.title===t);

/* ---------- Navigasi: tombol back selalu kembali ke menu utama ---------- */
function go(v,t){const s={v,t};history[cur.v==='home'&&v!=='home'?'pushState':'replaceState'](s,'');cur=s;show(s)}
async function show(s){
  if(leaving){const f=leaving;leaving=null;await f()}
  syncRib=null;scrollTo(0,0);
  if(s.v==='read'&&has(s.t))read(s.t);
  else if(s.v==='edit'&&has(s.t))edit(s.t,false);
  else if(s.v==='new')edit(s.t||'',true);
  else home();
}
onpopstate=e=>{cur=e.state||{v:'home'};show(cur)};
const hd=on=>$('#hd').classList.toggle('hide',!on);
$('#bk').onclick=()=>history.back();

/* ---------- Beranda ---------- */
const COL=['#5f6368','#c5221f','#188038','#1a73e8','#9334e6','#e37400','#d01884','#007b83'];
const col=t=>COL[[...t].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
function home(){
  hd(false);app.className='home';
  app.innerHTML=`<div class="hm">
  <svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="6" width="40" height="52" rx="4" fill="#fff" stroke="#36c" stroke-width="3"/><path d="M40 6v12h12" fill="none" stroke="#36c" stroke-width="3" stroke-linejoin="round"/><path d="M20 28h24M20 36h24M20 44h14" stroke="#36c" stroke-width="3" stroke-linecap="round"/></svg>
  <div class="wm">Manuscript</div>
  <input id="q" class="pill" placeholder="Telusuri halaman" autocomplete="off">
  <div id="grid" class="grid"></div></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase();
    const l=notes.filter(n=>(n.title+' '+(n.plain||'')).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);
    $('#grid').innerHTML=`<button class="tile" data-new><span class="ci plus">+</span><span class="lb">Baru</span></button>`+
      l.map(n=>`<button class="tile" data-open="${esc(n.title)}"><span class="ci" style="background:${col(n.title)}">${esc([...n.title][0].toUpperCase())}</span><span class="lb">${esc(n.title)}</span></button>`).join('');};
  $('#q').oninput=draw;draw();
}

/* ---------- Mode baca (gaya Wikipedia) ---------- */
const mark=r=>r.querySelectorAll('a[data-link]').forEach(a=>a.classList.toggle('new',!has(a.dataset.link)));
function read(t){
  hd(true);app.className='read';
  const n=notes.find(x=>x.title===t);
  app.innerHTML=`<div class="titlebar"><h1>${esc(n.title)}</h1><button class="pen" id="pen" aria-label="Sunting">✎</button></div><div class="content" id="ct">${n.html||'<p class="muted">Halaman ini masih kosong. Ketuk pena untuk mulai menulis.</p>'}</div>`;
  mark($('#ct'));$('#pen').onclick=()=>go('edit',t);
}

/* ---------- Mode sunting (gaya Microsoft Word) ---------- */
const AL=a=>`<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="${{l:'M2 4h14M2 8h9M2 12h14M2 16h9',c:'M2 4h14M5 8h8M2 12h14M5 16h8',r:'M2 4h14M7 8h9M2 12h14M7 16h9',j:'M2 4h14M2 8h14M2 12h14M2 16h14',u:'M2 4h2M7 4h9M2 9h2M7 9h9M2 14h2M7 14h9'}[a]}"/></svg>`;
const BT=(c,l,t)=>`<button data-c="${c}" title="${t}">${l}</button>`;
const BI=(i,l)=>`<button class="txt" data-i="${i}">${l}</button>`;
function edit(t,isNew){
  hd(false);app.className='edit';
  const n=isNew?{title:t,html:''}:notes.find(x=>x.title===t);
  app.innerHTML=`<div class="wd">
  <div class="wbar"><button id="bk2" aria-label="Kembali">←</button>${isNew?`<input id="tt" placeholder="Judul halaman" value="${esc(n.title)}">`:`<div class="wt">${esc(n.title)}</div>`}<button id="sv">Simpan</button></div>
  <div class="tabs"><button class="on" data-t="rh">Beranda</button><button data-t="rs">Sisipkan</button></div>
  <div class="rib" id="rh">${BT('undo','↶','Urungkan')}${BT('redo','↷','Ulangi')}<i class="sp"></i>
    <select id="st"><option value="p">Normal</option><option value="h2">Judul 1</option><option value="h3">Judul 2</option><option value="h4">Judul 3</option></select><i class="sp"></i>
    ${BT('bold','<b>B</b>','Tebal')}${BT('italic','<i>I</i>','Miring')}${BT('underline','<u>U</u>','Garis bawah')}${BT('strikeThrough','<s>S</s>','Coret')}<i class="sp"></i>
    ${BT('justifyLeft',AL('l'),'Rata kiri')}${BT('justifyCenter',AL('c'),'Tengah')}${BT('justifyRight',AL('r'),'Rata kanan')}${BT('justifyFull',AL('j'),'Rata kiri-kanan')}<i class="sp"></i>
    ${BT('insertUnorderedList',AL('u'),'Daftar poin')}${BT('insertOrderedList','1.','Daftar angka')}${BT('outdent','⇤','Kurangi indentasi')}${BT('indent','⇥','Tambah indentasi')}</div>
  <div class="rib hide" id="rs">${BI('tbl','▦ Tabel')}${BI('row','+ Baris')}${BI('col','+ Kolom')}${BI('deltbl','− Tabel')}<i class="sp"></i>${BI('img','🖼 Gambar')}${BI('link','🔗 Tautan')}${BI('hr','― Garis')}</div>
  <div class="canvas"><div class="paper content" id="ed" contenteditable="true" data-ph="Ketuk di sini untuk mulai menulis"></div></div>
  <div class="sbar"><span id="wc"></span>${isNew?'<span></span>':'<button id="dl">Hapus halaman</button>'}</div></div>`;
  const ed=$('#ed');ed.innerHTML=n.html||'';mark(ed);
  document.execCommand('defaultParagraphSeparator',false,'p');
  const wc=()=>$('#wc').textContent=(ed.innerText.trim().split(/\s+/).filter(Boolean).length)+' kata';wc();
  let rng=null;
  const ex=(c,v)=>{ed.focus();document.execCommand(c,false,v)};
  const rest=()=>{ed.focus();if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}};
  syncRib=()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))rng=s.getRangeAt(0).cloneRange();
    if(document.activeElement!==ed)return;
    document.querySelectorAll('[data-c]').forEach(b=>{let on=false;try{on=document.queryCommandState(b.dataset.c)}catch(e){}b.classList.toggle('on',on&&!/^(undo|redo|indent|outdent)$/.test(b.dataset.c))});
    const bl=(document.queryCommandValue('formatBlock')||'').toLowerCase().replace(/[<>]/g,'');$('#st').value=/^h[234]$/.test(bl)?bl:'p'};
  document.onselectionchange=()=>{if(syncRib)syncRib()};
  ed.oninput=()=>{if(ed.innerHTML==='<br>')ed.innerHTML='';wc()};
  ed.onpaste=e=>{e.preventDefault();ex('insertText',e.clipboardData.getData('text/plain'))};
  document.querySelectorAll('.rib').forEach(r=>{
    r.onmousedown=e=>{if(e.target.tagName!=='SELECT'&&e.target.tagName!=='OPTION')e.preventDefault()};
    r.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.c){ex(b.dataset.c);syncRib()}else if(b.dataset.i){rest();A[b.dataset.i]();wc()}};
  });
  $('#st').onchange=e=>{rest();ex('formatBlock',e.target.value)};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
    $('#rh').classList.toggle('hide',b.dataset.t!=='rh');$('#rs').classList.toggle('hide',b.dataset.t!=='rs')});
  const cell=()=>{const x=getSelection().anchorNode,el=x&&(x.nodeType===3?x.parentElement:x);return el&&el.closest?el.closest('#ed td,#ed th'):null};
  const A={
    tbl:()=>ex('insertHTML','<table class="wikitable"><tr><th><br></th><th><br></th><th><br></th></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></table><p><br></p>'),
    row:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');
      const r=c.parentNode.cloneNode(true);r.querySelectorAll('th,td').forEach(x=>{const d=document.createElement('td');d.innerHTML='<br>';x.replaceWith(d)});c.parentNode.after(r)},
    col:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');const i=c.cellIndex;
      c.closest('table').querySelectorAll('tr').forEach(r=>{const o=r.cells[i],x=document.createElement(o?o.tagName:'td');x.innerHTML='<br>';o?o.after(x):r.append(x)})},
    deltbl:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');if(confirm('Hapus tabel ini?'))c.closest('table').remove()},
    img:()=>$('#fi').click(),
    link:()=>{const s=getSelection().toString();const x=(prompt('Judul halaman tujuan:',s)||'').trim();if(!x)return;
      rest();ex('insertHTML',`<a href="#" data-link="${esc(x)}">${esc(s||x)}</a>&nbsp;`);mark(ed)},
    hr:()=>ex('insertHorizontalRule')};
  $('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    const d=await shrink(f);rest();ex('insertHTML',`<figure class="thumb"><img src="${d}" alt=""><figcaption>Keterangan gambar</figcaption></figure><p><br></p>`)};

  async function persist(auto){
    let title=(isNew?$('#tt').value:n.title).trim();
    const html=ed.innerHTML==='<br>'?'':ed.innerHTML,plain=ed.innerText.trim();
    if(!isNew&&html===n.html)return n.title;
    if(isNew){
      if(!title&&!plain&&!html)return null;
      title=title||'Tanpa judul';
      if(has(title)){if(!auto){alert('Judul "'+title+'" sudah dipakai. Pilih judul lain.');return null}
        let k=2;while(has(title+' ('+k+')'))k++;title+=' ('+k+')'}
    }
    await put({id:title,title,html,plain,updated:Date.now()});await load();return title;
  }
  leaving=()=>persist(true);
  $('#bk2').onclick=()=>history.back();
  $('#sv').onclick=async()=>{leaving=null;const r=await persist(false);
    if(r)go('read',r);else{leaving=()=>persist(true);if(isNew&&!$('#tt').value.trim())alert('Isi judul halaman terlebih dahulu.')}};
  if(!isNew)$('#dl').onclick=async()=>{if(confirm('Hapus halaman "'+n.title+'"?')){leaving=null;await del(n.title);await load();history.back()}};
  if(isNew&&!n.title)$('#tt').focus();
}
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)})}

/* ---------- Awal ---------- */
app.addEventListener('click',e=>{
  const a=e.target.closest('a[data-link]');
  if(a){e.preventDefault();if(cur.v==='edit')return;const t=a.dataset.link;has(t)?go('read',t):go('new',t);return}
  const o=e.target.closest('[data-open]');if(o)return go('read',o.dataset.open);
  if(e.target.closest('[data-new]'))go('new','');
});
load().then(()=>{history.replaceState({v:'home'},'');home()});
</script>
</body>
</html>
