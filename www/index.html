<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manuscript</title>
<style>
:root{--ln:#a2a9b1;--lk:#0645ad;--bg2:#f8f9fa;--wd:#2b579a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:16px/1.65 -apple-system,Roboto,"Segoe UI",sans-serif;color:#202122;background:#fff}
button{font:inherit;cursor:pointer;color:inherit}
.hide{display:none!important}
/* header halaman baca */
#hd{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;border-bottom:1px solid var(--ln);background:var(--bg2);position:sticky;top:0;z-index:5}
#hd button{width:40px;height:40px;border:0;background:none;font-size:22px;border-radius:50%}
.logo{font:22px Georgia,"Linux Libertine",serif}
main.read{max-width:820px;margin:auto;padding:4px 16px 80px}
main.edit{padding:0}
/* konten gaya Wikipedia (dipakai di mode baca dan kertas editor) */
.content h1,.content h2,.content h3,.content h4,h1{font-family:Georgia,"Linux Libertine",serif;line-height:1.3}
h1{font-size:1.8em;font-weight:400;margin:.4em 0;border-bottom:1px solid var(--ln)}
.content h2{font-size:1.5em;font-weight:400;margin:1em 0 .5em;border-bottom:1px solid var(--ln)}
.content h3{font-size:1.2em;margin:1em 0 .3em}.content h4{font-size:1.05em;margin:1em 0 .3em}
.content p{margin:.6em 0}
.content a{color:var(--lk);text-decoration:none}.content a.new{color:#ba0000}
.content .wikitable{border-collapse:collapse;background:var(--bg2);border:1px solid var(--ln);margin:1em 0;max-width:100%}
.content .wikitable th,.content .wikitable td{border:1px solid var(--ln);padding:.3em .6em;min-width:3em}
.content .wikitable th{background:#eaecf0}
.content figure.thumb{max-width:420px;margin:12px auto;border:1px solid #c8ccd1;background:var(--bg2);padding:4px;font-size:.88em}
.content figure.thumb img{width:100%;display:block}
.content figure.thumb figcaption{padding:4px 2px}
.content img{max-width:100%;height:auto}
.content figure.thumb{position:relative;width:max-content;max-width:100%;}
.content figure.thumb img{width:100%;height:auto;object-fit:contain;max-width:100%}
.content figure.thumb.selected{outline:2px solid #185abd;outline-offset:2px}
.content figure.thumb figcaption[contenteditable="true"]{min-height:1.4em;outline:none}
.content .table-scroll{display:block;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;margin:1em 0;-webkit-overflow-scrolling:touch}.content table.wikitable{table-layout:auto;width:auto;max-width:none}.content .table-scroll table.wikitable{width:max-content;min-width:100%;margin:0}.content .table-scroll td,.content .table-scroll th{min-width:64px;overflow-wrap:anywhere;}
.content table.wikitable td,.content table.wikitable th{min-width:36px;max-width:100%;overflow-wrap:anywhere}
#ed a{cursor:pointer}
.titlebar{display:flex;align-items:flex-end;gap:8px}.titlebar h1{flex:1}

.wm{font:34px Georgia,"Linux Libertine",serif;margin:6px 0 26px}

.pill:focus{box-shadow:0 0 0 2px #8ab4f8}

.tile{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}

/* editor ala Word */
.wd{position:fixed;inset:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:#e1e1e1;z-index:10}
.wbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--wd);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 8px 6px}

.wbar input,.wbar .wt{flex:1;min-width:0;background:rgba(255,255,255,.15);border:0;border-radius:4px;padding:8px 10px;color:#fff;font:16px sans-serif;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar input::placeholder{color:#cdd9ee}
.tabs{flex:0 0 auto;display:flex;background:#f3f3f3;border-bottom:1px solid #d4d4d4}

.rib button.txt{font-size:14px}
.rib select,.rib input[type="number"],.rib input[type="color"]{flex:none;height:36px;border:1px solid #c8c8c8;border-radius:4px;background:#fff;font:14px sans-serif;margin:0 3px}.rib input[type="number"]{width:62px;padding:4px}.rib input[type="color"]{width:38px;padding:3px}

.paper:empty:before{content:attr(data-ph);color:#9a9a9a}
.sbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;background:var(--wd);color:#fff;font-size:13px;padding:4px 12px calc(4px + env(safe-area-inset-bottom))}
.sbar button{border:0;background:none;color:#ffd0d0;font-size:13px;padding:6px 8px}
.content figure.thumb.wrap-left{float:left;margin:8px 16px 8px 0}.content figure.thumb.wrap-right{float:right;margin:8px 0 8px 16px}.content figure.thumb.align-left{margin-left:0;margin-right:auto}.content figure.thumb.align-center{margin-left:auto;margin-right:auto}.content figure.thumb.align-right{margin-left:auto;margin-right:0}

/* folder & menu tambah */
.ci.sq{border-radius:14px;background:#3a4049}

<body>
<header id="hd" class="hide"><button id="bk" aria-label="Kembali">←</button><div class="logo">Manuscript</div><button id="mo" class="hide" aria-label="Menu pilihan">⋮</button></header>
<main id="app"></main>
<input type="file" id="fi" accept="image/*" class="hide">
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- Penyimpanan: satu file per halaman, folder asli di Documents/Manuscript ---------- */
// Di APK: Documents/Manuscript/ di penyimpanan HP (butuh izin penyimpanan)
// Di browser (uji coba): IndexedDB. IndexedDB juga dipakai untuk memindahkan catatan lama ke file.
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const plug=n=>Capacitor.registerPlugin?Capacitor.registerPlugin(n):Capacitor.Plugins[n];
const FS=NATIVE?plug('Filesystem'):null,AF=NATIVE?plug('AllFiles'):null,AP=NATIVE?plug('App'):null;
const DIR='DOCUMENTS',FOLDER='Manuscript';
const db=new Promise((ok,no)=>{const r=indexedDB.open('manuscript',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('notes',{keyPath:'id'});
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('notes',m),o=f(t.objectStore('notes'));t.oncomplete=()=>ok(o&&o.result);t.onerror=()=>no(t.error)})};
let notes=[],folders=[],cur={v:'home',p:''},leaving=null,syncRib=null,flushEdit=null,sheetEl=null,selMode=false,selSet=new Set();
const mk=(p,t)=>p?p+'/'+t:t,keyOf=n=>mk(n.path||'',n.title);
const byKey=k=>notes.find(n=>keyOf(n)===k);
const resolveLink=(t,ctx)=>notes.find(n=>(n.path||'')===ctx&&n.title===t)||notes.find(n=>n.title===t);
const parentOf=f=>f.includes('/')?f.slice(0,f.lastIndexOf('/')):'';
const fname=t=>t.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').trim().slice(0,80)||'Tanpa judul';
const uniqueFile=(t,p,skip)=>{const b=fname(t);let f=b+'.json',k=2;while(notes.some(x=>x!==skip&&(x.path||'')===p&&(x.file||'').toLowerCase()===f.toLowerCase()))f=b+' ('+(k++)+').json';return f};
const fsPath=(p,f)=>FOLDER+(p?'/'+p:'')+(f?'/'+f:'');
async function load(){
  if(!FS){
    const all=await idb('readonly',o=>o.getAll());
    notes=all.filter(x=>!x.folder).map(n=>({...n,path:n.path||''}));
    folders=all.filter(x=>x.folder).map(x=>x.path);return;
  }
  try{
    try{await FS.mkdir({path:FOLDER,directory:DIR,recursive:true})}catch(e){}
    const out=[],dirs=[];
    const scan=async p=>{
      const r=await FS.readdir({path:fsPath(p),directory:DIR});
      for(const f of r.files){
        const name=f.name||f;
        if(f.type==='directory'){const sub=mk(p,name);dirs.push(sub);await scan(sub)}
        else if(/\.json$/i.test(name)){
          try{const d=await FS.readFile({path:fsPath(p,name),directory:DIR,encoding:'utf8'});
            const n=JSON.parse(d.data);if(!n||!n.title)continue;n.file=name;n.path=p;n.id=mk(p,n.title);out.push(n)}catch(e){}
        }
      }
    };
    await scan('');notes=out;folders=dirs;
  }catch(e){alert('Gagal membaca penyimpanan: '+(e.message||e));notes=[];folders=[]}
}
async function put(n){
  try{
    n.path=n.path||'';
    if(!FS){await idb('readwrite',o=>o.put(n));return}
    if(!n.file)n.file=uniqueFile(n.title,n.path);
    await FS.writeFile({path:fsPath(n.path,n.file),data:JSON.stringify(n),directory:DIR,encoding:'utf8',recursive:true});
  }catch(e){alert('Gagal menyimpan: '+(e.message||e));throw e}
}
async function del(n){
  try{if(FS)await FS.deleteFile({path:fsPath(n.path||'',n.file),directory:DIR});else await idb('readwrite',o=>o.delete(n.id))}
  catch(e){alert('Gagal menghapus: '+(e.message||e));throw e}
}
async function mkFolder(path){
  try{if(FS)await FS.mkdir({path:fsPath(path),directory:DIR,recursive:true});else await idb('readwrite',o=>o.put({id:'dir:'+path,folder:true,path}))}
  catch(e){alert('Gagal membuat folder: '+(e.message||e));throw e}
}
async function migrate(){ // catatan lama -> file di Documents/Manuscript
  if(!FS)return;
  try{ // versi lama yang menyimpan di Android/data/...
    const r=await FS.readdir({path:FOLDER,directory:'EXTERNAL'});
    for(const f of r.files){const name=f.name||f;if(!/\.json$/i.test(name))continue;
      const d=await FS.readFile({path:FOLDER+'/'+name,directory:'EXTERNAL',encoding:'utf8'}),n=JSON.parse(d.data);
      if(n&&n.title&&!byKey(n.title)){n.path='';n.id=n.title;delete n.file;await put(n);notes.push(n)}
      await FS.deleteFile({path:FOLDER+'/'+name,directory:'EXTERNAL'});
    }
  }catch(e){}
  const old=(await idb('readonly',o=>o.getAll())).filter(x=>!x.folder);if(!old.length)return;
  for(const n of old){n.path=n.path||'';n.id=keyOf(n);if(!byKey(n.id)){delete n.file;await put(n);notes.push(n)}}
  await idb('readwrite',o=>o.clear());
}

/* ---------- Navigasi: back = naik satu tingkat (catatan -> foldernya -> folder induk) ---------- */
function go(v,t,p){
  const s={v,t,p:p||''};
  const push=cur.v==='home'&&(v!=='home'||s.p!==cur.p);
  history[push?'pushState':'replaceState'](s,'');cur=s;show(s);
}
async function show(s){
  if(leaving){const f=leaving;leaving=null;await f()}
  syncRib=null;flushEdit=null;selMode=false;selSet.clear();scrollTo(0,0);
  if(s.v==='read'&&byKey(s.t))read(s.t);
  else if(s.v==='edit'&&byKey(s.t))edit(s.t,false);
  else if(s.v==='new')edit(s.t||'',true,s.p);
  else home(s.p);
}
onpopstate=e=>{cur=e.state||{v:'home',p:''};show(cur)};
const hd=(on,t)=>{$('#hd').classList.toggle('hide',!on);$('#hd .logo').textContent=t||'Manuscript';$('#bk').textContent=selMode?'✕':'←';$('#mo').classList.toggle('hide',!(selMode&&on))};
function goBack(){
  if(closeSheet())return;
  if(selMode){selMode=false;selSet.clear();home(cur.p);return}
  if(cur.v==='home'&&!cur.p){if(AP)AP.exitApp();return}
  const before=cur;history.back();
  setTimeout(()=>{ // cadangan bila riwayat browser tidak punya halaman sebelumnya
    if(cur!==before)return;
    const p=before.v==='home'?parentOf(before.p||''):before.v==='new'?(before.p||''):((byKey(before.t)||{}).path||'');
    cur={v:'home',p};history.replaceState(cur,'');show(cur);
  },300);
}
$('#bk').onclick=goBack;

/* ---------- Beranda & folder ---------- */
const LOGO='<svg width="68" height="68" viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="6" width="40" height="52" rx="4" fill="#fff" stroke="#36c" stroke-width="3"/><path d="M40 6v12h12" fill="none" stroke="#36c" stroke-width="3" stroke-linejoin="round"/><path d="M20 28h24M20 36h24M20 44h14" stroke="#36c" stroke-width="3" stroke-linecap="round"/></svg><div class="wm">Manuscript</div>';
const PICON='<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#e8eaed"/><path d="M14 2l6 6h-4a2 2 0 0 1-2-2z" fill="#aab0b9"/><path d="M8 13h8M8 17h6" stroke="#5f6672" stroke-width="1.6" stroke-linecap="round"/></svg>';
const FICON='<svg width="30" height="30" viewBox="0 0 24 24" fill="#f6c453" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
function home(p){
  p=p||'';if(p&&!folders.includes(p))p='';
  if(cur.v==='home')cur.p=p;
  hd(!!p||selMode,selMode?selSet.size+' dipilih':p.replace(/\//g,' / '));app.className='home';
  app.innerHTML=`<div class="hm" style="${p||selMode?'padding-top:18px;':''}${selMode?'padding-bottom:110px':''}">${p||selMode?'':LOGO}
  <input id="q" class="pill" placeholder="${p?'Telusuri di folder ini':'Telusuri halaman'}" autocomplete="off">
  <div id="grid" class="grid"></div><p class="muted" id="hint" style="font-size:12px;margin-top:34px"></p></div>${selMode?'<div class="selbar"><button id="sdel">🗑 Hapus</button><button id="smov">➜ Pindahkan</button></div>':''}`;
  $('#hint').textContent=FS?'Tersimpan di Documents/'+FOLDER+(p?'/'+p:''):'';

      nl.map(n=>`<button class="tile${selSet.has('f'+keyOf(n))?' sel':''}" data-open="${esc(keyOf(n))}"><span class="ci file">${PICON}</span><span class="lb">${esc(n.title)}</span></button>`).join('')+
      (!fl.length&&!nl.length?`<p class="muted" style="grid-column:1/-1;font-size:13px;margin:6px 0 0">${q?'Tidak ada yang cocok.':'Folder ini masih kosong.'}</p>`:'');

function refreshSel(){

function selMenu(){

    a=>{const arr=a==='f'?fk:dk;if(all(arr))arr.forEach(k=>selSet.delete(k));else arr.forEach(k=>selSet.add(k));home(cur.p)},'pop');

async function delSelected(items){
  if(!items.length)return;
  const nf=items.filter(i=>i.f!==null).length,nn=items.length-nf;
  if(!confirm('Hapus '+items.length+' item terpilih ('+nf+' folder, '+nn+' file)?'+(nf?' Folder dihapus beserta semua isinya.':'')+' Tindakan ini tidak bisa dibatalkan.'))return;
  try{for(const it of items){if(it.f!==null)await rmTree(it.f);else{await del(it.n);notes=notes.filter(x=>x!==it.n)}}}catch(e){}
  selMode=false;selSet.clear();home(cur.p);
}
function closeSheet(){if(!sheetEl)return false;sheetEl.remove();sheetEl=null;return true}
function sheet(html,onAct,cls){
  closeSheet();

  o.onclick=async e=>{if(Date.now()-born<350)return;const a=e.target.dataset.a;
    if(e.target===o||a==='x'){closeSheet();return}

function addMenu(p){
  sheet(`<b>Tambah di ${esc(p?FOLDER+' / '+p.replace(/\//g,' / '):FOLDER)}</b><button data-a="f">📄 Tambah file</button><button data-a="d">📁 Tambah folder</button><button data-a="x">Batal</button>`,
    async a=>{if(a==='f')go('new','',p);if(a==='d')await newFolder(p)});
}
async function newFolder(p){
  const raw=(prompt('Nama folder:','')||'').trim();if(!raw)return;
  const name=fname(raw),path=mk(p,name);
  if(folders.some(f=>f.toLowerCase()===path.toLowerCase()))return alert('Folder "'+name+'" sudah ada.');
  await mkFolder(path);folders.push(path);home(p);
}

/* ---------- Duplikat, ganti nama, hapus ---------- */
const under=(x,f)=>x===f||x.startsWith(f+'/');
async function copyTree(f,dst){
  const subF=folders.filter(x=>under(x,f)),subN=notes.filter(n=>under(n.path||'',f)),remap=x=>dst+x.slice(f.length);
  for(const x of subF){const d=remap(x);await mkFolder(d);folders.push(d)}
  for(const n of subN){const c={...n,path:remap(n.path||''),file:undefined};c.id=keyOf(c);await put(c);notes.push(c)}
}
async function rmTree(f){
  try{
    if(FS)await FS.rmdir({path:fsPath(f),directory:DIR,recursive:true});
    else{
      for(const n of notes.filter(n=>under(n.path||'',f)))await idb('readwrite',o=>o.delete(n.id));
      for(const x of folders.filter(x=>under(x,f)))await idb('readwrite',o=>o.delete('dir:'+x));
    }
  }catch(e){alert('Gagal menghapus folder: '+(e.message||e));throw e}
  notes=notes.filter(n=>!under(n.path||'',f));folders=folders.filter(x=>!under(x,f));
}
async function moveTree(f,dst){await copyTree(f,dst);await rmTree(f)}
async function dupFolder(f){
  const par=parentOf(f),base=f.split('/').pop();let k=1;
  while(folders.some(x=>x.toLowerCase()===mk(par,fname(base+'_'+k)).toLowerCase()))k++;
  await copyTree(f,mk(par,fname(base+'_'+k)));
}
async function dupNote(n){
  let k=1;while(byKey(mk(n.path||'',n.title+'_'+k)))k++;
  const c={...n,title:n.title+'_'+k,file:undefined,updated:Date.now()};c.id=keyOf(c);
  await put(c);notes.push(c);
}
async function renameFolder(f){
  const par=parentOf(f),old=f.split('/').pop();
  const raw=(prompt('Nama folder baru:',old)||'').trim();if(!raw)return;
  const name=fname(raw);if(name===old)return;
  const dst=mk(par,name);
  if(name.toLowerCase()===old.toLowerCase()){const tmp=mk(par,'_tmp'+Date.now());await moveTree(f,tmp);await moveTree(tmp,dst);return}
  if(folders.some(x=>x.toLowerCase()===dst.toLowerCase()))return alert('Folder "'+name+'" sudah ada.');
  await moveTree(f,dst);
}
async function doMove(f,n,dest){
  if(f!==null){
    if(under(dest,f))return alert('Folder tidak bisa dipindahkan ke dalam dirinya sendiri.');
    const base=f.split('/').pop();let name=base,k=1;
    while(folders.some(x=>x.toLowerCase()===mk(dest,name).toLowerCase()))name=base+'_'+(k++);
    if(name!==base)alert('Di tujuan sudah ada folder "'+base+'". Folder dipindahkan dengan nama "'+name+'".');
    await moveTree(f,mk(dest,name));
  }else{
    let title=n.title,k=1;
    while(byKey(mk(dest,title)))title=n.title+'_'+(k++);
    if(title!==n.title)alert('Di tujuan sudah ada halaman "'+n.title+'". Halaman dipindahkan dengan nama "'+title+'".');
    const c={...n,title,path:dest,file:undefined};c.id=keyOf(c);
    await put(c);await del(n);notes=notes.filter(x=>x!==n);notes.push(c);
  }
}
function movePicker(items){
  const one=items.length===1?items[0]:null,first=items[0];
  const name=one?(one.f!==null?one.f.split('/').pop():one.n.title):items.length+' item';
  const from=first.f!==null?parentOf(first.f):(first.n.path||'');
  let at=from;closeSheet();
  const o=document.createElement('div'),born=Date.now();o.className='sheet';sheetEl=o;
  const draw=()=>{
    const subs=folders.filter(x=>parentOf(x)===at&&!items.some(it=>it.f!==null&&under(x,it.f))).sort((a,b)=>a.localeCompare(b)),same=at===from;
    o.innerHTML=`<div class="box" style="max-height:85vh"><b>Pindahkan "${esc(name)}" ke:</b>
    <div class="muted">${esc(FOLDER+(at?' / '+at.replace(/\//g,' / '):''))}</div>
    <div style="overflow-y:auto;display:flex;flex-direction:column;gap:8px;max-height:42vh">
      ${at?'<button data-g="..">⬆ Naik satu tingkat</button>':''}
      ${subs.map(x=>`<button data-g="${esc(x)}">📁 ${esc(x.split('/').pop())}</button>`).join('')||'<span class="muted">Tidak ada folder di sini.</span>'}
    </div>
    <button data-a="go"${same?' disabled':''}>${same?'Sudah di lokasi ini':'Pindahkan ke sini'}</button><button data-a="x">Batal</button></div>`;
  };
  o.onclick=async e=>{
    if(Date.now()-born<350)return;
    const bt=e.target.closest('button'),g=bt?bt.dataset.g:undefined,a=bt?bt.dataset.a:undefined;
    if(e.target===o||a==='x'){closeSheet();return}
    if(g!==undefined){at=g==='..'?parentOf(at):g;draw();return}
    if(a==='go'&&at!==from){closeSheet();try{for(const it of items)await doMove(it.f,it.n,at)}catch(err){}selMode=false;selSet.clear();home(cur.p)}
  };
  draw();document.body.append(o);
}
function itemMenu(t){
  const f=t.dataset.dir!==undefined?t.dataset.dir:null,n=f===null?byKey(t.dataset.open):null;
  if(f===null&&!n)return;
  const name=f!==null?f.split('/').pop():n.title;
  sheet(`<b>${f!==null?'📁':'📄'} ${esc(name)}</b><button data-a="sel">☑ Pilih</button><button data-a="dup">⧉ Duplikat</button><button data-a="mov">➜ Pindahkan</button>${f!==null?'<button data-a="ren">✎ Ganti nama</button>':''}<button data-a="del" style="color:#ff8a80">🗑 Hapus</button><button data-a="x">Batal</button>`,
    async a=>{
      try{
        if(a==='dup'){if(f!==null)await dupFolder(f);else await dupNote(n)}
        else if(a==='sel'){selMode=true;selSet=new Set([f!==null?'d'+f:'f'+keyOf(n)]);home(cur.p);return}
        else if(a==='mov'){movePicker([{f,n}]);return}
        else if(a==='ren')await renameFolder(f);
        else if(a==='del'){
          if(!confirm(f!==null?'Hapus folder "'+name+'" beserta SEMUA isinya? Tindakan ini tidak bisa dibatalkan.':'Hapus halaman "'+name+'"? Tindakan ini tidak bisa dibatalkan.'))return;
          if(f!==null)await rmTree(f);else{await del(n);notes=notes.filter(x=>x!==n)}
        }
        home(cur.p);
      }catch(e){}
    });
}

    row:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');
      const r=c.parentNode.cloneNode(true);r.querySelectorAll('th,td').forEach(x=>{const d=document.createElement('td');d.innerHTML='<br>';x.replaceWith(d)});c.parentNode.after(r)},
    col:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');const i=c.cellIndex;
      c.closest('table').querySelectorAll('tr').forEach(r=>{const o=r.cells[i],x=document.createElement(o?o.tagName:'td');x.innerHTML='<br>';o?o.after(x):r.append(x)})},
    delrow:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');const t=c.closest('table');if(t.rows.length<=1){alert('Tabel harus memiliki minimal satu baris.');return}c.parentElement.remove()},
    delcol:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');const t=c.closest('table');if(!t.rows[0]||t.rows[0].cells.length<=1){alert('Tabel harus memiliki minimal satu kolom.');return}const i=c.cellIndex;Array.from(t.rows).forEach(r=>{if(r.cells[i])r.deleteCell(i)})},
    deltbl:()=>{const c=cell();if(!c)return alert('Ketuk di dalam tabel terlebih dahulu.');if(confirm('Hapus tabel ini?'))c.closest('.table-scroll')?.remove()||c.closest('table').remove()},
    img:()=>$('#fi').click(),
    url:()=>{const url=(prompt('Masukkan alamat web (https://...)')||'').trim();if(!url)return;const safe=/^https?:\/\//i.test(url)?url:'https://'+url;const label=(prompt('Teks tautan:',safe)||safe).trim();rest();ex('insertHTML',`<a href="${esc(safe)}" target="_blank" rel="noopener">${esc(label)}</a>&nbsp;`);},
    pagebreak:()=>ex('insertHTML','<div style="break-before:page;border-top:2px dashed #9aa0a6;margin:24px 0;padding-top:8px;color:#777" contenteditable="false">— Pemisah halaman —</div><p><br></p>'),
    symbol:()=>{const sym=prompt('Masukkan simbol (contoh: ©, ™, €, →, ±):','©');if(sym)ex('insertText',sym)},
    imgleft:()=>{if(!selectedFigure)return alert('Pilih gambar terlebih dahulu.');selectedFigure.classList.remove('align-center','align-right');selectedFigure.classList.remove('wrap-left','wrap-right');selectedFigure.classList.add('align-left');selectedFigure.style.float='none'},
    imgcenter:()=>{if(!selectedFigure)return alert('Pilih gambar terlebih dahulu.');selectedFigure.classList.remove('align-left','align-right');selectedFigure.classList.remove('wrap-left','wrap-right');selectedFigure.classList.add('align-center');selectedFigure.style.float='none'},
    imgright:()=>{if(!selectedFigure)return alert('Pilih gambar terlebih dahulu.');selectedFigure.classList.remove('align-left','align-center');selectedFigure.classList.remove('wrap-left','wrap-right');selectedFigure.classList.add('align-right');selectedFigure.style.float='none'},
    crop:()=>{if(!selectedFigure)return alert('Pilih gambar terlebih dahulu.');const im=selectedFigure.querySelector('img');const h=prompt('Tinggi area gambar dalam piksel untuk memotong tampilan:',String(Math.max(60,Math.round(im.getBoundingClientRect().height*0.8))));if(!h)return;const n=Math.max(40,Math.min(1200,Number(h)||100));im.style.height=n+'px';im.style.objectFit='cover';im.style.objectPosition='center';im.dataset.cropped='1';},
    imgdel:()=>{if(!selectedFigure)return alert('Pilih gambar terlebih dahulu.');if(confirm('Hapus gambar ini?')){selectedFigure.remove();selectedFigure=null}},
    link:()=>{const s=getSelection().toString();const x=(prompt('Judul halaman tujuan:',s)||'').trim();if(!x)return;
      rest();ex('insertHTML',`<a href="#" data-link="${esc(x)}">${esc(s||x)}</a>&nbsp;`);mark(ed,path)},
    hr:()=>ex('insertHorizontalRule')};
  $('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
    const d=await shrink(f);rest();ex('insertHTML',`<figure class="thumb align-center" style="width:100%" data-new="1"><img src="${d}" alt=""><figcaption contenteditable="true">Keterangan gambar</figcaption></figure><p><br></p>`);const nf=ed.querySelector('figure[data-new]');if(nf){nf.removeAttribute('data-new');selectFigure(nf)}};

  const tt=$('#tt');
  let cn=isNew?null:n,q=Promise.resolve(),tm=null,dead=false;
  async function persist(auto){
    if(dead)return cn?keyOf(cn):null;
    let title=tt.value.trim().replace(/[\\/]/g,'-');
    const html=ed.innerHTML==='<br>'?'':cleanHTML(),plain=ed.innerText.trim();
    if(!cn&&!title&&!plain&&!html)return null;
    if(!title&&cn)title=cn.title;
    if(cn&&title===cn.title&&html===cn.html)return keyOf(cn);
    title=title||'Tanpa judul';
    if(!cn||title!==cn.title){
      if(byKey(mk(path,title))){
        if(!auto){alert('Judul "'+title+'" sudah dipakai di folder ini. Pilih judul lain.');return null}
        if(cn)title=cn.title;
        else{let k=2;while(byKey(mk(path,title+' ('+k+')')))k++;title+=' ('+k+')'}
      }
    }
    const same=!!cn&&title===cn.title;
    let file=same?cn.file:undefined,delOld=!!cn&&!same;
    if(delOld){const f=uniqueFile(title,path,cn);if(f.toLowerCase()===(cn.file||'').toLowerCase()){file=cn.file;delOld=false}}
    const o={id:mk(path,title),title,html,plain,updated:Date.now(),path,file};
    await put(o);
    if(delOld){try{await del(cn)}catch(e){}}
    if(cn&&!same)notes=notes.filter(x=>x!==cn);
    const i=notes.findIndex(x=>keyOf(x)===o.id);i>=0?notes[i]=o:notes.push(o);
    cn=o;return o.id;
  }
  const run=auto=>{const r=q.then(()=>persist(auto));q=r.catch(()=>{});return r};
  const sched=()=>{clearTimeout(tm);tm=setTimeout(()=>run(true).catch(()=>{}),1000)};
  const doLeave=async()=>{clearTimeout(tm);await run(true).catch(()=>{});dead=true};
  leaving=doLeave;
  flushEdit=()=>{clearTimeout(tm);run(true).catch(()=>{})};
  const W=$('.wd');['input','change','click'].forEach(ev=>W.addEventListener(ev,sched));
  $('#bk2').onclick=goBack;
  $('#sv').onclick=async()=>{clearTimeout(tm);leaving=null;const r=await run(false).catch(()=>null);
    if(r){dead=true;go('read',r)}
    else{leaving=doLeave;if(isNew&&!tt.value.trim()&&!ed.innerText.trim())alert('Isi judul atau isi halaman terlebih dahulu.')}};
  if(!isNew)$('#dl').onclick=async()=>{if(confirm('Hapus halaman "'+n.title+'"? Tindakan ini tidak bisa dibatalkan.')){
    dead=true;leaving=null;clearTimeout(tm);await q.catch(()=>{});await del(cn);notes=notes.filter(x=>x!==cn);goBack()}};
  if(isNew&&!n.title)tt.focus();
}
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)})}

/* ---------- Awal ---------- */
app.addEventListener('click',e=>{
  if(lpDone){lpDone=false;return}
  if(selMode){const t=e.target.closest('.tile[data-dir],.tile[data-open]');
    if(t){const k=t.dataset.dir!==undefined?'d'+t.dataset.dir:'f'+t.dataset.open;selSet.has(k)?selSet.delete(k):selSet.add(k);t.classList.toggle('sel');refreshSel()}
    return}
  const a=e.target.closest('a[data-link]');
  if(a){e.preventDefault();if(cur.v==='edit')return;const t=a.dataset.link,ctx=cur.v==='read'?((byKey(cur.t)||{}).path||''):'',r=resolveLink(t,ctx);r?go('read',keyOf(r)):go('new',t,ctx);return}
  const d=e.target.closest('[data-dir]');if(d)return go('home',null,d.dataset.dir);
  const o=e.target.closest('[data-open]');if(o)return go('read',o.dataset.open);
  if(e.target.closest('[data-new]'))addMenu(cur.p||'');
});
/* ---------- Tekan lama pada folder/file ---------- */
let lpT=null,lpDone=false,lpX=0,lpY=0;
app.addEventListener('pointerdown',e=>{
  if(selMode)return;
  const t=e.target.closest('.tile[data-dir],.tile[data-open]');if(!t)return;
  lpDone=false;lpX=e.clientX;lpY=e.clientY;clearTimeout(lpT);
  lpT=setTimeout(()=>{lpDone=true;if(navigator.vibrate)navigator.vibrate(15);itemMenu(t)},500);
});
app.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-lpX)+Math.abs(e.clientY-lpY)>12)clearTimeout(lpT)});
['pointerup','pointercancel'].forEach(ev=>app.addEventListener(ev,()=>clearTimeout(lpT)));
app.addEventListener('contextmenu',e=>{if(e.target.closest('.tile'))e.preventDefault()});

/* ---------- Simpan otomatis saat aplikasi ditutup / ke latar belakang ---------- */
const flushNow=()=>{if(flushEdit)flushEdit()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNow()});
addEventListener('pagehide',flushNow);
if(AP){AP.addListener('appStateChange',st=>{if(!st.isActive)flushNow()});AP.addListener('backButton',goBack)}

/* ---------- Izin penyimpanan & mulai ---------- */
let waitPerm=false;
const permStatus=async()=>{try{return await AF.status()}catch(e){return{granted:true,sdk:0}}};
async function ensurePerm(){
  if(!FS)return true;
  const s=await permStatus();
  if(s.sdk<30){try{await FS.requestPermissions()}catch(e){}return true}
  if(s.granted)return true;
  waitPerm=true;hd(false);app.className='home';
  app.innerHTML=`<div class="hm"><div class="wm">Izin penyimpanan</div><p class="muted">Agar catatan tersimpan di folder Documents/Manuscript, aktifkan <b>Izinkan akses semua file</b> untuk Manuscript, lalu kembali ke aplikasi.</p><button class="pen" id="gp" style="width:auto;padding:0 22px;border-radius:24px;font-size:16px">Beri izin</button></div>`;
  $('#gp').onclick=()=>AF.request();
  return false;
}
async function boot(){await load();await migrate();cur={v:'home',p:''};history.replaceState(cur,'');home('')}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&waitPerm&&(await permStatus()).granted){waitPerm=false;boot()}});
(async()=>{if(await ensurePerm())boot()})();
</script>
