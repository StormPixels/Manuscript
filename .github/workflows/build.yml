name: Build APK Manuscript

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependensi
        run: npm install

      - name: Tambah platform Android (jika belum ada)
        run: '[ -d android ] || npx cap add android'

      - name: Izin penyimpanan dan plugin native
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q MANAGE_EXTERNAL_STORAGE $M || sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application android:requestLegacyExternalStorage="true"|' $M
          D=android/app/src/main/java/com/manuscript/app
          mkdir -p $D
          cat > $D/AllFilesPlugin.java <<'JAVA'
          package com.manuscript.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AllFiles")
          public class AllFilesPlugin extends Plugin {
              @PluginMethod
              public void status(PluginCall call) {
                  JSObject r = new JSObject();
                  boolean ok = Build.VERSION.SDK_INT < 30 || Environment.isExternalStorageManager();
                  r.put("granted", ok);
                  r.put("sdk", Build.VERSION.SDK_INT);
                  call.resolve(r);
              }

              @PluginMethod
              public void request(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 30) {
                      Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                              Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  }
                  call.resolve();
              }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.manuscript.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AllFilesPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Tema gelap dan splash
        run: |
          R=android/app/src/main/res
          mkdir -p $R/values
          cat > $R/values/manuscript_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="manuscript_bg">#202328</color>
          </resources>
          XML
          cat > $R/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/manuscript_bg</item>
                  <item name="colorPrimaryDark">@color/manuscript_bg</item>
                  <item name="colorAccent">#8AB4F8</item>
                  <item name="android:windowBackground">@color/manuscript_bg</item>
                  <item name="android:statusBarColor">@color/manuscript_bg</item>
                  <item name="android:navigationBarColor">@color/manuscript_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">@color/manuscript_bg</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                  <item name="android:windowBackground">@color/manuscript_bg</item>
                  <item name="android:statusBarColor">@color/manuscript_bg</item>
                  <item name="android:navigationBarColor">@color/manuscript_bg</item>
              </style>
          </resources>
          XML

      - name: Sinkronkan aplikasi web
        run: npx cap sync android

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk Manuscript.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Manuscript-APK
          path: Manuscript.apk
