name: Build APK Manuskrip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependensi
        run: npm install

      - name: Tambah platform Android (jika belum ada)
        run: '[ -d android ] || npx cap add android'

      - name: Sinkronkan aplikasi web
        run: npx cap sync android

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk Manuskrip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Manuskrip-APK
          path: Manuskrip.apk
